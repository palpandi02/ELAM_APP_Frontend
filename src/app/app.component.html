<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand text-primary fw-bold" routerLink="#">ELAM APP</a>
      <div class="d-flex align-items-center">
        <!-- Display username and logout button after login -->
        <div class="user-profile" *ngIf="isLoggedIn">
          <i class="fas fa-user-circle me-2"></i>
          <span class="username">{{ username }}</span>
        </div>
        <button *ngIf="isLoggedIn" class="btn btn-outline-dark me-2" (click)="logout()">Logout</button>
        <!-- Display sign-in button before login -->
        <button *ngIf="!isLoggedIn" class="btn btn-outline-dark me-2" routerLink="/login">Sign in</button>
      </div>
      <!-- Navbar Toggler for Sidebar -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#sidebar"
        aria-controls="sidebar"
        aria-expanded="false"
        aria-label="Toggle sidebar"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
  </nav>

  <!-- Sidebar and Content -->
  <div class="d-flex">
    <!-- Sidebar visible only for logged-in  -->
    <app-sidebar *ngIf="isLoggedIn" id="sidebar"></app-sidebar>
    <div class="content flex-grow-1 bg-light">
      <router-outlet></router-outlet>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-white text-center py-3 shadow-sm">
    <div class="container">
      <h5 class="text-primary">Contact Us</h5>
      <p>Email: support&#64;elamapp.com</p>
      <p>Phone: +91 9876543210</p>
      <p>Address: ELAM APP Headquarters, Tech Park, City Center</p>
      <hr />
      <p>&copy; 2025 ELAM APP. All rights reserved.</p>
    </div>
  </footer>
</body>
